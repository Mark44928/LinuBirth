<style>
  @font-face {
    font-family: 'Comic Neue';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('assets/fonts/comic-neue-400.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Comic Neue';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('assets/fonts/comic-neue-700.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Patrick Hand';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('assets/fonts/patrick-hand-400.woff2') format('woff2');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
    color: #1b5e20;
    background: #a7f3d0;
    background-image: radial-gradient(circle at 50% 40%, #86efac, #a7f3d0 55%, #bbf7d0);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  svg { position: absolute; width: 0; height: 0; shape-rendering: geometricPrecision; }
  .card {
    position: relative;
    transform: rotate(-1.2deg);
    border: 6px double #1b5e20;
    border-radius: 2.2rem 1.4rem 2.6rem 1.1rem;
    background: #fff;
    padding: 1.6rem 1.2rem 2rem;
    max-width: 92vw;
    text-align: center;
    box-shadow: 0 10px 30px rgba(27,94,32,0.25);
  }
  .card:hover { transform: rotate(0.8deg) scale(1.015); transition: transform .5s cubic-bezier(.2,1.3,.4,1); }
  h1 {
    font-family: 'Patrick Hand', 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
    font-size: clamp(2.2rem, 8vw, 4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0b3d0e;
    text-shadow: 2px 2px 0 #ffab40;
    animation: bobble 3s ease-in-out infinite;
  }
  @keyframes bobble {
    0%,100% { transform: rotate(-1deg); }
    25% { transform: rotate(1.5deg); }
    75% { transform: rotate(-1.5deg); }
  }
  .tagline {
    margin: 0.5rem 0 1.2rem;
    font-size: clamp(1rem, 4vw, 1.25rem);
    color: #2e7d32;
    font-style: italic;
  }
  .portrait {
    margin: 0 auto 1rem;
    border: 8px solid #fff;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 5px #1b5e20;
    filter: url(#wobble);
    transform: rotate(-3deg);
    transition: transform .4s ease;
  }
  .portrait:hover { transform: rotate(3deg) scale(1.03); }
  .portrait img { display: block; width: 260px; height: auto; image-rendering: auto; border-radius: 50%; }
  .credit {
    font-size: 0.75rem;
    color: #558b2f;
    margin-bottom: 1.2rem;
  }
  .timer {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
    margin-bottom: 1rem;
  }
  .unit {
    border: 4px double #1b5e20;
    border-radius: 1rem;
    padding: 0.7rem 0.9rem;
    background: #fff9c4;
    transform: rotate(-1.5deg);
  }
  .unit:nth-child(even) { transform: rotate(2deg); }
  .unit span {
    display: block;
    font-family: 'Patrick Hand', 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .unit small { font-size: 0.62rem; text-transform: uppercase; color: #558b2f; }
  #party { margin-top: 1rem; }
  #party h2 {
    font-family: 'Patrick Hand', 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
    font-size: clamp(1.4rem, 7vw, 2.2rem);
    color: #e53935;
    text-shadow: 2px 2px 0 #fff9c4;
    animation: wiggle 0.6s ease-in-out infinite alternate;
  }
  @keyframes wiggle { from { transform: rotate(-3deg) translateX(-4px); } to { transform: rotate(3deg) translateX(4px); } }
  .hidden { display: none !important; }
  .penguins {
    margin-top: 1.2rem;
    display: flex;
    gap: 0.9rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .tux {
    width: clamp(60px, 14vw, 110px);
    height: auto;
    image-rendering: auto;
    filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.25));
    transform: rotate(-3deg);
    transition: transform 0.4s ease;
  }
  .tux:hover { transform: rotate(3deg) scale(1.12); }
  .tux:nth-child(1) { animation: drift 4s ease-in-out infinite; }
  .tux:nth-child(2) { animation: drift 5.3s ease-in-out infinite; animation-delay: 1s; }
  .tux:nth-child(3) { animation: drift 4.7s ease-in-out infinite; animation-delay: 2.1s; }
  .tux:nth-child(4) { animation: drift 6s ease-in-out infinite; animation-delay: 0.4s; }
  @keyframes drift { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
  .share {
    margin-top: 1rem;
    margin-right: 0.5rem;
    font-family: 'Comic Neue', 'Comic Sans MS', system-ui, sans-serif;
    font-size: 1rem;
    cursor: pointer;
    background: #ffab40;
    color: #1b5e20;
    border: 3px solid #1b5e20;
    border-radius: 1rem;
    padding: 0.5rem 1.1rem;
    box-shadow: 2px 2px 0 #1b5e20;
    transition: transform .15s ease;
  }
  .share:hover { transform: rotate(-2deg) scale(1.05); }
  .share:active { transform: translateY(2px); box-shadow: none; }
  #confetti-btn { background: #e53935; color: #fff; }
  canvas#confetti { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<svg>
  <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main class="card">
  <h1>LinuBirth</h1>
  <p class="tagline">The pretty useless countdown to Linus Torvalds&rsquo; birthday.</p>
  <div class="portrait">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Linus_Torvalds.jpeg" alt="Linus Torvalds">
  </div>
  <p class="credit">Photo: Linus Torvalds, December 2002 &mdash; Wikimedia Commons (CC BY-SA 3.0 / GFDL)</p>
  <div id="timer" class="timer">
    <div class="unit"><span id="d">00</span><small>days</small></div>
    <div class="unit"><span id="h">00</span><small>hours</small></div>
    <div class="unit"><span id="m">00</span><small>mins</small></div>
    <div class="unit"><span id="s">00</span><small>secs</small></div>
  </div>
  <div id="party" class="hidden">
    <h2>HAPPY BIRTHDAY LINUS 🎂</h2>
  </div>
  <div class="penguins">
    <img class="tux" src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg" alt="Tux">
    <img class="tux" src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg" alt="Tux">
    <img class="tux" src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg" alt="Tux">
    <img class="tux" src="https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg" alt="Tux">
  </div>
  <button class="share" id="confetti-btn">🎉 Confetti</button>
  <button class="share" id="share">Share this site</button>
  <p class="credit" style="margin-top: 1.4rem;">Tux SVG: Larry Ewing &amp; The GIMP, via Wikimedia Commons (attribution only)</p>
</main>
<canvas id="confetti"></canvas>
<script>
  (function () {
    var dEl = document.getElementById('d');
    var hEl = document.getElementById('h');
    var mEl = document.getElementById('m');
    var sEl = document.getElementById('s');
    var timer = document.getElementById('timer');
    var party = document.getElementById('party');
    var canvas = document.getElementById('confetti');
    var ctx = canvas.getContext('2d');
    var particles = [];
    var shareBtn = document.getElementById('share');
    var confettiBtn = document.getElementById('confetti-btn');

    confettiBtn.addEventListener('click', function () { burst(); confetti(); });

    shareBtn.addEventListener('click', function () {
      var data = { title: 'LinuBirth', text: 'The pretty useless countdown to Linus Torvalds\u2019 birthday.', url: location.href };
      if (navigator.share) {
        navigator.share(data).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(data.url).then(function () {
          shareBtn.textContent = 'Copied!';
          setTimeout(function () { shareBtn.textContent = 'Share this site'; }, 1600);
        });
      }
    });

    function targetDate () {
      var now = new Date();
      var target = new Date(now.getFullYear(), 11, 28);
      if (target.getTime() <= now.getTime()) {
        target = new Date(now.getFullYear() + 1, 11, 28);
      }
      return target;
    }

    function pad (n) { return String(n).padStart(2, '0'); }

    function tick () {
      var now = new Date();
      var target = targetDate();
      var diff = Math.floor((target - now) / 1000);
      if (diff <= 0) {
        timer.classList.add('hidden');
        party.classList.remove('hidden');
        startConfetti();
        return;
      }
      party.classList.add('hidden');
      timer.classList.remove('hidden');
      var days = Math.floor(diff / 86400);
      diff %= 86400;
      var hours = Math.floor(diff / 3600);
      diff %= 3600;
      var mins = Math.floor(diff / 60);
      var secs = diff % 60;
      dEl.textContent = pad(days);
      hEl.textContent = pad(hours);
      mEl.textContent = pad(mins);
      sEl.textContent = pad(secs);
    }

    function resizeCanvas () {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function randomRange (a, b) { return Math.random() * (b - a) + a; }

    function burst () {
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 3;
      var colors = ['#1b5e20', '#ffab40', '#e53935', '#fff9c4', '#86efac'];
      for (var i = 0; i < 120; i++) {
        particles.push({
          x: cx, y: cy,
          vx: randomRange(-6, 6), vy: randomRange(-12, -2),
          size: randomRange(3, 8),
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 100
        });
      }
    }

    function confetti () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.size *= 0.96;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI * 2);
        ctx.fill();
        if (p.life <= 0 || p.size < 0.5) { particles.splice(i, 1); }
      }
      if (particles.length) { requestAnimationFrame(confetti); }
    }

    function startConfetti () { burst(); confetti(); }

    setInterval(tick, 1000);
    tick();
  })();
</script>
</body>
</html>
